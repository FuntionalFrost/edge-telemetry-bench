name: Multi-Platform Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================
  # STAGE 1: Continuous Integration (Quality & Compilability)
  # =========================================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Materialize Dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Code Analysis (Lint & Formatting)
        run: pnpm lint

      - name: Type Check Project Verification
        run: pnpm check

  # =========================================================
  # STAGE 2: Continuous Deployment (Parallel Cloud Delivery)
  # =========================================================
  cd:
    name: Deploy to ${{ matrix.target }}
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Infrastructure concept: Don't kill other deployments if one vendor flakes
      matrix:
        target: [Cloudflare, Vercel, Netlify]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Materialize Dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------
      # TARGET MATRIX SLICE: CLOUDFLARE
      # ---------------------------------------------------
      - name: Execute Cloudflare Build & Deployment Loop
        if: matrix.target == 'Cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler types --config wrangler.worker.jsonc
          pnpm build:cloudflare
          pnpm wrangler deploy --config wrangler.worker.jsonc
          pnpm wrangler pages deploy --config wrangler.pages.jsonc

      # ---------------------------------------------------
      # TARGET MATRIX SLICE: VERCEL
      # ---------------------------------------------------
      - name: Execute Vercel Build & Deployment Loop
        if: matrix.target == 'Vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          # Build locally on the runner using the configuration we prepared
          pnpm build:vercel
          # Bundle and deploy the locally compiled output folder
          pnx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # ---------------------------------------------------
      # TARGET MATRIX SLICE: NETLIFY
      # ---------------------------------------------------
      - name: Execute Netlify Build & Deployment Loop
        if: matrix.target == 'Netlify'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm build:netlify
          # Fix: Redirect directory target to 'build' where static assets live
          pnx netlify deploy --prod --dir=build --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
