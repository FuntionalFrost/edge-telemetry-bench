name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IBM_TELEMETRY_DISABLED: 'true'
  VERCEL_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  ci:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js 26
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true

      - name: Static Code Analysis (Lint & Formatting)
        run: pnpm lint

      - name: Type Check Project Verification
        run: pnpm check
